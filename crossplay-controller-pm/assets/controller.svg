    <linearGradient id="trigger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e4845"/>
      <stop offset="1" stop-color="#0d1110"/>
    </linearGradient>
    <radialGradient id="glow">
