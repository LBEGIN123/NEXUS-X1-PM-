<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">NEXUS X1 controller render</title>
  <desc id="desc">A stylized charcoal cross-platform gaming controller with cyan accent lighting.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b5652"/>
      <stop offset=".18" stop-color="#232a28"/>
      <stop offset=".5" stop-color="#111514"/>
      <stop offset=".82" stop-color="#1c2220"/>
      <stop offset="1" stop-color="#3c4542"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
