      <stop offset=".45" stop-color="#151a19"/>
      <stop offset="1" stop-color="#080a0a"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#333c39"/>
      <stop offset=".45" stop-color="#111514"/>
      <stop offset="1" stop-color="#050707"/>
    </linearGradient>
    <linearGradient id="stick" x1="0" y1="0" x2="1" y2="1">
